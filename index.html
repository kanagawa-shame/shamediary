<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>写メ日記メーカー</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: "Hiragino Maru Gothic ProN", "Hiragino Sans", "Noto Sans JP", sans-serif;
    background: #fff5f7;
    color: #4a3540;
    margin: 0;
    padding: 16px;
  }
  .wrap { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 22px; text-align: center; color: #d6336c; margin: 8px 0 4px; }
  .sub { text-align: center; font-size: 13px; color: #a3768a; margin-bottom: 20px; }
  .card {
    background: #fff;
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 16px;
    box-shadow: 0 2px 8px rgba(214, 51, 108, 0.08);
  }
  label { display: block; font-size: 13px; font-weight: bold; color: #b03060; margin: 12px 0 6px; }
  label:first-child { margin-top: 0; }
  input[type="text"], select {
    width: 100%;
    padding: 10px 12px;
    border: 1.5px solid #f3c6d3;
    border-radius: 10px;
    font-size: 16px;
    background: #fff;
    color: #4a3540;
  }
  .checks { margin-top: 14px; }
  .checks label {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: normal;
    color: #4a3540;
    margin: 8px 0;
    cursor: pointer;
  }
  .checks input[type="checkbox"] { width: 18px; height: 18px; accent-color: #d6336c; }
  button.generate {
    width: 100%;
    margin-top: 18px;
    padding: 14px;
    font-size: 17px;
    font-weight: bold;
    color: #fff;
    background: #e75480;
    border: none;
    border-radius: 12px;
    cursor: pointer;
  }
  button.generate:active { background: #d6336c; }
  .result { display: none; }
  .diary {
    border: 1.5px solid #f3c6d3;
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 12px;
    background: #fffafb;
  }
  .diary p { margin: 0 0 10px; font-size: 15px; line-height: 1.7; white-space: pre-wrap; }
  .part-label { font-size: 12px; font-weight: bold; color: #b03060; margin: 10px 0 4px; }
  .part-label:first-child { margin-top: 0; }
  button.copy {
    padding: 8px 18px;
    font-size: 14px;
    font-weight: bold;
    color: #d6336c;
    background: #ffe3ec;
    border: none;
    border-radius: 999px;
    cursor: pointer;
    margin-bottom: 6px;
  }
  button.copy.done { background: #d6336c; color: #fff; }
  .foot { text-align: center; font-size: 12px; color: #c09bab; margin-top: 24px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>📸 写メ日記メーカー</h1>
  <p class="sub">条件を選ぶと、写メ日記の文章を1パターン作ります<br>もう一度押すと、別のパターンが出ます</p>

  <div class="card">
    <label for="name">名前（源氏名）</label>
    <input type="text" id="name" placeholder="例：あい">

    <label for="style">文体</label>
    <select id="style">
      <option value="cute" selected>かわいい系</option>
      <option value="mature">しっとり・大人系（人妻・熟女）</option>
    </select>

    <label for="purpose">用途</label>
    <select id="purpose">
      <option value="normal" selected>通常</option>
      <option value="thanks">お礼</option>
      <option value="returns">久しぶりの出勤</option>
      <option value="previews">出勤予告・次回案内</option>
    </select>

    <label for="length">文章の長さ</label>
    <select id="length">
      <option value="short">短め</option>
      <option value="normal" selected>ふつう</option>
      <option value="long">長め</option>
    </select>

    <label for="time">時間帯</label>
    <select id="time">
      <option>朝</option>
      <option selected>昼</option>
      <option>夕方</option>
      <option>夜</option>
    </select>

    <label for="mood">今日の気分（通常のとき）</label>
    <select id="mood">
      <option>元気</option>
      <option>まったり</option>
      <option>甘えたい</option>
      <option>大人っぽい</option>
    </select>

    <label for="weather">天気</label>
    <select id="weather">
      <option value="">なし</option>
      <option>晴れ</option>
      <option>雨</option>
      <option>曇り</option>
      <option>雪</option>
    </select>

    <label for="appeal">アピール</label>
    <select id="appeal">
      <option>出勤中</option>
      <option>予約受付中</option>
      <option>残りわずか</option>
    </select>

    <div class="checks">
      <label><input type="checkbox" id="useTitle" checked> タイトルも付ける（本文とは別にコピーできます）</label>
      <label><input type="checkbox" id="useSeason"> 季節（秋・冬）の話題を追加する</label>
      <label><input type="checkbox" id="useDaily"> 日常の小ネタを追加する</label>
    </div>

    <button class="generate" id="gen">文章を作る♪</button>
  </div>

  <div class="card result" id="results">
    <div id="list"></div>
  </div>

  <p class="foot">パターンは随時追加されます♪</p>
</div>

<script src="patterns.js"></script>
<script>
  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
  function pickOther(arr, avoid) {
    if (arr.length <= 1) return arr[0];
    var v = pick(arr);
    var guard = 0;
    while (v === avoid && guard < 10) { v = pick(arr); guard++; }
    return v;
  }
  function fill(text, name) { return text.split("{name}").join(name); }
  function makeCopyButton(text) {
    var btn = document.createElement("button");
    btn.className = "copy";
    btn.textContent = "コピーする";
    btn.addEventListener("click", function () {
      navigator.clipboard.writeText(text).then(function () {
        btn.textContent = "コピーしました♪";
        btn.classList.add("done");
        setTimeout(function () { btn.textContent = "コピーする"; btn.classList.remove("done"); }, 2000);
      });
    });
    return btn;
  }

  document.getElementById("gen").addEventListener("click", function () {
    var name = document.getElementById("name").value.trim() || "わたし";
    var style = document.getElementById("style").value;
    var purpose = document.getElementById("purpose").value;
    var lengthMode = document.getElementById("length").value;
    var time = document.getElementById("time").value;
    var mood = document.getElementById("mood").value;
    var weather = document.getElementById("weather").value;
    var appeal = document.getElementById("appeal").value;
    var useTitle = document.getElementById("useTitle").checked;
    var useSeason = document.getElementById("useSeason").checked;
    var useDaily = document.getElementById("useDaily").checked;

    var isMature = (style === "mature");
    var isShort = (lengthMode === "short");
    var isLong = (lengthMode === "long");

    var moodPool = isMature ? PATTERNS.mature.moods : PATTERNS.moods[mood];
    var closingPool = isMature ? PATTERNS.mature.closings : PATTERNS.closings;

    var titleText = null;
    if (useTitle && PATTERNS.titles) {
      titleText = fill(pick(PATTERNS.titles), name);
    }

    var lines = [];
    if (isMature) {
      lines.push(fill(pick(PATTERNS.mature.greetings[time]), name));
    } else {
      lines.push(fill(pick(PATTERNS.greetings[time]), name));
    }

    if (!isShort) {
      if (weather) lines.push(fill(pick(PATTERNS.weather[weather]), name));
      if ((useSeason || isLong) && PATTERNS.season_autumn_winter) {
        lines.push(fill(pick(PATTERNS.season_autumn_winter), name));
      }
      if ((useDaily || isLong) && PATTERNS.daily) {
        lines.push(fill(pick(PATTERNS.daily), name));
      }
    }

    if (purpose === "normal") {
      if (!isShort) {
        var moodLine = fill(pick(moodPool), name);
        lines.push(moodLine);
        if (isLong) lines.push(fill(pickOther(moodPool, moodLine), name));
      }
      lines.push(fill(pick(PATTERNS.appeals[appeal]), name));
    } else {
      if (isLong) lines.push(fill(pick(moodPool), name));
      lines.push(fill(pick(PATTERNS[purpose]), name));
      if (purpose === "returns" && !isShort) {
        lines.push(fill(pick(PATTERNS.appeals[appeal]), name));
      }
      if (purpose === "returns" && isShort) {
        lines.push(fill(pick(PATTERNS.appeals[appeal]), name));
      }
    }

    lines.push(fill(pick(closingPool), name));
    var bodyText = lines.join("\n");

    var list = document.getElementById("list");
    list.innerHTML = "";

    var box = document.createElement("div");
    box.className = "diary";

    if (titleText !== null) {
      var tl = document.createElement("div");
      tl.className = "part-label";
      tl.textContent = "タイトル";
      var tp = document.createElement("p");
      tp.textContent = titleText;
      box.appendChild(tl);
      box.appendChild(tp);
      box.appendChild(makeCopyButton(titleText));

      var bl = document.createElement("div");
      bl.className = "part-label";
      bl.textContent = "本文";
      box.appendChild(bl);
    }

    var bp = document.createElement("p");
    bp.textContent = bodyText;
    box.appendChild(bp);
    box.appendChild(makeCopyButton(bodyText));

    list.appendChild(box);
    document.getElementById("results").style.display = "block";
    document.getElementById("results").scrollIntoView({ behavior: "smooth" });
  });
</script>
</body>
</html>
