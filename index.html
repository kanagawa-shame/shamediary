<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>写メ日記メーカー</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: "Hiragino Maru Gothic ProN", "Hiragino Sans", "Noto Sans JP", sans-serif;
    background: #fff5f7;
    color: #4a3540;
    margin: 0;
    padding: 16px;
  }
  .wrap { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 22px; text-align: center; color: #d6336c; margin: 8px 0 4px; }
  .ver { font-size: 12px; color: #b56b87; font-weight: normal; margin-left: 6px; vertical-align: middle; }
  .sub { text-align: center; font-size: 13px; color: #a3768a; margin-bottom: 20px; }
  .card {
    background: #fff;
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 16px;
    box-shadow: 0 2px 8px rgba(214, 51, 108, 0.08);
  }
  .sec-title { font-size: 12px; font-weight: bold; color: #b03060; margin-bottom: 10px; }
  label { display: block; font-size: 13px; font-weight: bold; color: #b03060; margin: 12px 0 6px; }
  label:first-child { margin-top: 0; }
  input[type="text"], input[type="time"], select, textarea {
    width: 100%;
    padding: 10px 12px;
    border: 1.5px solid #f3c6d3;
    border-radius: 10px;
    font-size: 16px;
    background: #fff;
    color: #4a3540;
    font-family: inherit;
  }
  textarea { line-height: 1.7; resize: vertical; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    border: none;
    background: #ffe3ec;
    color: #d6336c;
    border-radius: 999px;
    padding: 7px 13px;
    font-size: 13px;
    cursor: pointer;
    font-family: inherit;
  }
  .chip.on { background: #d6336c; color: #fff; font-weight: bold; }
  details.card { padding: 0; }
  details.card summary {
    padding: 14px 16px;
    font-size: 13px;
    font-weight: bold;
    color: #b03060;
    cursor: pointer;
    list-style: none;
  }
  details.card .detail-body { padding: 0 16px 16px; }
  .row2 { display: flex; gap: 10px; }
  .row2 > div { flex: 1; }
  .checks { margin-top: 14px; }
  .checks label {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: normal;
    color: #4a3540;
    margin: 8px 0;
    cursor: pointer;
  }
  .checks input[type="checkbox"] { width: 18px; height: 18px; accent-color: #d6336c; }
  button.generate {
    width: 100%;
    padding: 14px;
    font-size: 17px;
    font-weight: bold;
    color: #fff;
    background: #e75480;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    margin-bottom: 16px;
  }
  button.generate:active { background: #d6336c; }
  .result { display: none; }
  .count { font-size: 12px; color: #a3768a; font-weight: normal; }
  .btn-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  button.copy {
    padding: 8px 14px;
    font-size: 13px;
    font-weight: bold;
    color: #d6336c;
    background: #ffe3ec;
    border: none;
    border-radius: 999px;
    cursor: pointer;
    font-family: inherit;
  }
  button.copy.main { background: #d6336c; color: #fff; }
  button.copy.done { background: #d6336c; color: #fff; }
  button.nav {
    padding: 7px 13px;
    font-size: 13px;
    color: #b03060;
    background: #fff;
    border: 1.5px solid #f3c6d3;
    border-radius: 999px;
    cursor: pointer;
    font-family: inherit;
  }
  button.nav:disabled { opacity: 0.4; cursor: default; }
  .history { display: none; margin-top: 12px; border-top: 1px dashed #f3c6d3; padding-top: 10px; }
  .history button {
    display: block;
    width: 100%;
    text-align: left;
    background: #fffafb;
    border: 1px solid #f3c6d3;
    border-radius: 10px;
    padding: 8px 10px;
    margin-bottom: 6px;
    font-size: 13px;
    color: #4a3540;
    cursor: pointer;
    font-family: inherit;
  }
  .history .h-time { font-size: 11px; color: #a3768a; display: block; }
  .foot { text-align: center; font-size: 12px; color: #c09bab; margin-top: 24px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>📸 写メ日記メーカー<span class="ver">ver2.00</span></h1>
  <p class="sub">基本を選ぶだけで、写メ日記の文章を1パターン作ります<br>もう一度押すと、別のパターンが出ます</p>

  <div class="card">
    <div class="sec-title">① 基本（これだけで作れる）</div>
    <label for="name">名前（源氏名）</label>
    <input type="text" id="name" placeholder="例：あい">

    <label>ジャンル</label>
    <div class="chips" id="genreChips">
      <button type="button" class="chip on" data-v="work">出勤中</button>
      <button type="button" class="chip" data-v="vacancy">空き枠</button>
      <button type="button" class="chip" data-v="before">出勤前</button>
      <button type="button" class="chip" data-v="thanks">お礼</button>
      <button type="button" class="chip" data-v="comeback">久しぶり</button>
      <button type="button" class="chip" data-v="after">退勤後</button>
      <button type="button" class="chip" data-v="food">ごはん・カフェ</button>
      <button type="button" class="chip" data-v="beauty">美容・ファッション</button>
      <button type="button" class="chip" data-v="next">次回予定</button>
    </div>

    <label>文体</label>
    <div class="chips" id="styleChips">
      <button type="button" class="chip on" data-v="cute">かわいい系</button>
      <button type="button" class="chip" data-v="adult">しっとり・大人系（人妻・熟女）</button>
    </div>
  </div>

  <details class="card">
    <summary>② くわしく選ぶ（任意）▸ タップで開く</summary>
    <div class="detail-body">
      <label for="topic">話題</label>
      <select id="topic"></select>

      <div class="row2">
        <div>
          <label for="timeSlot">時間帯</label>
          <select id="timeSlot">
            <option>朝</option>
            <option selected>昼</option>
            <option>夕方</option>
            <option>夜</option>
          </select>
        </div>
        <div>
          <label for="mood">今日の気分</label>
          <select id="mood">
            <option selected>元気</option>
            <option>まったり</option>
            <option>甘えたい</option>
            <option>大人っぽい</option>
          </select>
        </div>
      </div>

      <div class="row2">
        <div>
          <label for="weather">天気</label>
          <select id="weather">
            <option value="" selected>なし</option>
            <option>晴れ</option>
            <option>雨</option>
            <option>曇り</option>
            <option>雪</option>
          </select>
        </div>
        <div>
          <label for="appeal">アピール</label>
          <select id="appeal">
            <option selected>出勤中</option>
            <option>予約受付中</option>
            <option>残りわずか</option>
          </select>
        </div>
      </div>

      <div class="row2">
        <div>
          <label for="startTime">出勤 開始</label>
          <input type="time" id="startTime">
        </div>
        <div>
          <label for="endTime">出勤 終了</label>
          <input type="time" id="endTime">
        </div>
      </div>

      <div class="row2">
        <div>
          <label for="lengthSel">文章の長さ</label>
          <select id="lengthSel">
            <option value="short">短め</option>
            <option value="normal" selected>ふつう</option>
            <option value="long">長め</option>
          </select>
        </div>
        <div>
          <label for="emojiSel">絵文字の量</label>
          <select id="emojiSel">
            <option value="none">なし</option>
            <option value="some" selected>控えめ</option>
            <option value="many">多め</option>
          </select>
        </div>
      </div>

      <div class="checks">
        <label><input type="checkbox" id="useSeason"> 季節（秋・冬）の話題を追加する</label>
        <label><input type="checkbox" id="useDaily"> 日常の小ネタを追加する</label>
      </div>
    </div>
  </details>

  <button class="generate" id="generateBtn">文章を作る♪</button>

  <div class="card result" id="resultCard">
    <div class="sec-title">③ 完成（そのまま編集できます）</div>
    <label for="titleText">タイトル <span class="count" id="titleCount"></span></label>
    <input type="text" id="titleText">
    <label for="bodyText">本文 <span class="count" id="bodyCount"></span></label>
    <textarea id="bodyText" rows="9"></textarea>
    <div class="btn-row">
      <button type="button" class="copy main" id="copyBoth">タイトル＋本文をコピー</button>
      <button type="button" class="copy" id="copyBody">本文のみ</button>
      <button type="button" class="copy" id="copyTitle">タイトルのみ</button>
    </div>
    <div class="btn-row">
      <button type="button" class="nav" id="backBtn">← 前の候補</button>
      <button type="button" class="nav" id="againBtn">別パターン</button>
      <button type="button" class="nav" id="historyBtn">履歴（0件）</button>
    </div>
    <div class="history" id="historyBox"></div>
  </div>

  <p class="foot">お気に入りの文章ができたらコピーして使ってね♪</p>
</div>

<script src="patterns.js"></script>
<script>
(function () {
  var genre = "work";
  var style = "cute";
  var results = [];
  var pos = -1;

  var TOPICS = {
    work:    [["auto", "おまかせ"], ["season", "季節の話題"], ["daily", "日常の小ネタ"]],
    vacancy: [["auto", "おまかせ"], ["season", "季節の話題"], ["daily", "日常の小ネタ"]],
    before:  [["auto", "おまかせ"], ["season", "季節の話題"], ["daily", "日常の小ネタ"]],
    thanks:  [["auto", "おまかせ"], ["season", "季節の話題"], ["daily", "日常の小ネタ"]],
    comeback:[["auto", "おまかせ"], ["season", "季節の話題"], ["daily", "日常の小ネタ"]],
    after:   [["auto", "おまかせ"], ["season", "季節の話題"], ["daily", "日常の小ネタ"]],
    next:    [["auto", "おまかせ"], ["season", "季節の話題"], ["daily", "日常の小ネタ"]],
    food:    [["auto", "おまかせ"], ["lunch", "ランチ"], ["cafe", "カフェ・甘いもの"], ["daily", "日常の小ネタ"]],
    beauty:  [["auto", "おまかせ"], ["hair", "ヘア・ネイル"], ["makeup", "メイク・香り"], ["daily", "日常の小ネタ"]]
  };
  var TOPIC_POOLS = {
    season: "season_autumn_winter", daily: "daily",
    lunch: "topicLunch", cafe: "topicCafe", hair: "topicHair", makeup: "topicMakeup"
  };

  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
  function fill(text, name) { return text.split("{name}").join(name); }
  function el(id) { return document.getElementById(id); }

  function setupChips(boxId, initial, onChange) {
    var box = el(boxId);
    var chips = box.querySelectorAll(".chip");
    var value = initial;
    chips.forEach(function (chip) {
      chip.addEventListener("click", function () {
        chips.forEach(function (c) { c.classList.remove("on"); });
        chip.classList.add("on");
        value = chip.getAttribute("data-v");
        onChange(value);
      });
    });
    return function () { return value; };
  }

  var getGenre = setupChips("genreChips", "work", function (v) {
    genre = v;
    buildTopics();
  });
  var getStyle = setupChips("styleChips", "cute", function (v) { style = v; });

  function buildTopics() {
    var sel = el("topic");
    sel.innerHTML = "";
    TOPICS[genre].forEach(function (t) {
      var o = document.createElement("option");
      o.value = t[0];
      o.textContent = t[1];
      sel.appendChild(o);
    });
  }
  buildTopics();

  function fmtTime(v) {
    if (!v) return "";
    var p = v.split(":");
    var h = parseInt(p[0], 10);
    var m = parseInt(p[1], 10);
    return m === 0 ? (h + "時") : (h + "時" + m + "分");
  }

  function applyEmoji(text, mode) {
    if (mode === "none") {
      return text.replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}\u{FE0F}♪]/gu, "").replace(/ +/g, " ").trim();
    }
    if (mode === "many") {
      var marks = ["✨", "💕", "🌸", "♪"];
      var lines = text.split("\n");
      for (var i = 0; i < lines.length; i++) {
        if (lines[i] && !/[✨💕🌸♪☀️🍁]$/.test(lines[i]) && Math.random() < 0.6) {
          lines[i] = lines[i] + pick(marks);
        }
      }
      return lines.join("\n");
    }
    return text;
  }

  function generate() {
    genre = getGenre();
    style = getStyle();
    var name = el("name").value.trim() || "わたし";
    var timeSlot = el("timeSlot").value;
    var mood = el("mood").value;
    var weather = el("weather").value;
    var appeal = el("appeal").value;
    var lengthMode = el("lengthSel").value;
    var emojiMode = el("emojiSel").value;
    var topic = el("topic").value;
    var useSeason = el("useSeason").checked;
    var useDaily = el("useDaily").checked;
    var short = lengthMode === "short";
    var long = lengthMode === "long";

    var greetingPool, moodPool, closingPool;
    if (style === "adult" && PATTERNS.mature) {
      greetingPool = PATTERNS.mature.greetings[timeSlot];
      moodPool = PATTERNS.mature.moods;
      closingPool = PATTERNS.mature.closings;
    } else {
      greetingPool = PATTERNS.greetings[timeSlot];
      moodPool = PATTERNS.moods[mood];
      closingPool = PATTERNS.closings;
    }

    var mainPool = null, withMood = true, withAppeal = false;
    if (genre === "work") { withAppeal = true; }
    else if (genre === "vacancy") { mainPool = PATTERNS.vacancy; }
    else if (genre === "before") { mainPool = PATTERNS.beforeWork; }
    else if (genre === "thanks") { mainPool = PATTERNS.thanks; withMood = false; }
    else if (genre === "comeback") { mainPool = PATTERNS.returns; withAppeal = true; }
    else if (genre === "after") { mainPool = PATTERNS.afterWork; withMood = false; }
    else if (genre === "food") { mainPool = PATTERNS.food; }
    else if (genre === "beauty") { mainPool = PATTERNS.beauty; }
    else if (genre === "next") { mainPool = PATTERNS.previews; withMood = false; }

    var lines = [];
    lines.push(fill(pick(greetingPool), name));
    if (!short) {
      if (withMood) lines.push(fill(pick(moodPool), name));
      if (weather) lines.push(fill(pick(PATTERNS.weather[weather]), name));
    }
    var st = fmtTime(el("startTime").value), en = fmtTime(el("endTime").value);
    if (st && en && (genre === "work" || genre === "vacancy" || genre === "before")) {
      lines.push(st + "から" + en + "まで出勤してます♪");
    }
    if (mainPool) lines.push(fill(pick(mainPool), name));
    if (withAppeal) lines.push(fill(pick(PATTERNS.appeals[appeal]), name));

    if (!short) {
      if (topic !== "auto" && TOPIC_POOLS[topic]) {
        lines.push(fill(pick(PATTERNS[TOPIC_POOLS[topic]]), name));
        if (topic === "season") useSeason = false;
        if (topic === "daily") useDaily = false;
      }
      if (useSeason) lines.push(fill(pick(PATTERNS.season_autumn_winter), name));
      if (useDaily) lines.push(fill(pick(PATTERNS.daily), name));
    }
    if (long) {
      lines.push(fill(pick(PATTERNS.season_autumn_winter), name));
      lines.push(fill(pick(PATTERNS.daily), name));
      lines.push(fill(pick(moodPool), name));
    }
    lines.push(fill(pick(closingPool), name));

    var titleText = fill(pick(PATTERNS.titles), name);
    titleText = applyEmoji(titleText, emojiMode);
    var bodyText = applyEmoji(lines.join("\n"), emojiMode);

    results.push({ title: titleText, body: bodyText, at: new Date() });
    if (results.length > 20) results.shift();
    pos = results.length - 1;
    showResult();
  }

  function updateCounts() {
    el("titleCount").textContent = "（" + el("titleText").value.length + "文字）";
    el("bodyCount").textContent = "（" + el("bodyText").value.length + "文字）";
  }

  function showResult() {
    var r = results[pos];
    if (!r) return;
    el("resultCard").style.display = "block";
    el("titleText").value = r.title;
    el("bodyText").value = r.body;
    el("backBtn").disabled = pos <= 0;
    el("historyBtn").textContent = "履歴（" + results.length + "件）";
    updateCounts();
    renderHistory();
  }

  function renderHistory() {
    var box = el("historyBox");
    box.innerHTML = "";
    for (var i = results.length - 1; i >= 0; i--) {
      (function (idx) {
        var r = results[idx];
        var b = document.createElement("button");
        var t = document.createElement("span");
        t.className = "h-time";
        var d = r.at;
        t.textContent = (d.getHours() + ":" + ("0" + d.getMinutes()).slice(-2)) + (idx === pos ? "・表示中" : "");
        b.appendChild(t);
        b.appendChild(document.createTextNode(r.title));
        b.addEventListener("click", function () { pos = idx; showResult(); });
        box.appendChild(b);
      })(i);
    }
  }

  function copyText(text, btn) {
    function done() {
      var old = btn.textContent;
      btn.textContent = "コピーしました♪";
      btn.classList.add("done");
      setTimeout(function () { btn.textContent = old; btn.classList.remove("done"); }, 1500);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done).catch(function () { fallback(); });
    } else { fallback(); }
    function fallback() {
      var ta = document.createElement("textarea");
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand("copy"); } catch (e) {}
      document.body.removeChild(ta);
      done();
    }
  }

  el("generateBtn").addEventListener("click", generate);
  el("againBtn").addEventListener("click", generate);
  el("backBtn").addEventListener("click", function () {
    if (pos > 0) { pos--; showResult(); }
  });
  el("historyBtn").addEventListener("click", function () {
    var box = el("historyBox");
    box.style.display = box.style.display === "block" ? "none" : "block";
  });
  el("copyBoth").addEventListener("click", function () {
    copyText(el("titleText").value + "\n" + el("bodyText").value, this);
  });
  el("copyBody").addEventListener("click", function () { copyText(el("bodyText").value, this); });
  el("copyTitle").addEventListener("click", function () { copyText(el("titleText").value, this); });
  el("titleText").addEventListener("input", updateCounts);
  el("bodyText").addEventListener("input", updateCounts);
})();
</script>
</body>
</html>
