<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>写メ日記メーカー</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: "Hiragino Maru Gothic ProN", "Hiragino Sans", "Noto Sans JP", sans-serif;
    background: #fff5f7;
    color: #4a3540;
    margin: 0;
    padding: 16px;
  }
  .wrap { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 22px; text-align: center; color: #d6336c; margin: 8px 0 4px; }
  .sub { text-align: center; font-size: 13px; color: #a3768a; margin-bottom: 20px; }
  .card {
    background: #fff;
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 16px;
    box-shadow: 0 2px 8px rgba(214, 51, 108, 0.08);
  }
  label { display: block; font-size: 13px; font-weight: bold; color: #b03060; margin: 12px 0 6px; }
  label:first-child { margin-top: 0; }
  input[type="text"], select {
    width: 100%;
    padding: 10px 12px;
    border: 1.5px solid #f3c6d3;
    border-radius: 10px;
    font-size: 16px;
    background: #fff;
    color: #4a3540;
  }
  button.generate {
    width: 100%;
    margin-top: 18px;
    padding: 14px;
    font-size: 17px;
    font-weight: bold;
    color: #fff;
    background: #e75480;
    border: none;
    border-radius: 12px;
    cursor: pointer;
  }
  button.generate:active { background: #d6336c; }
  .result { display: none; }
  .diary {
    border: 1.5px solid #f3c6d3;
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 12px;
    background: #fffafb;
  }
  .diary p { margin: 0 0 10px; font-size: 15px; line-height: 1.7; white-space: pre-wrap; }
  button.copy {
    padding: 8px 18px;
    font-size: 14px;
    font-weight: bold;
    color: #d6336c;
    background: #ffe3ec;
    border: none;
    border-radius: 999px;
    cursor: pointer;
  }
  button.copy.done { background: #d6336c; color: #fff; }
  .foot { text-align: center; font-size: 12px; color: #c09bab; margin-top: 24px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>📸 写メ日記メーカー</h1>
  <p class="sub">条件を選ぶと、写メ日記の文章を3パターン作ります</p>

  <div class="card">
    <label for="name">名前（源氏名）</label>
    <input type="text" id="name" placeholder="例：あい">

    <label for="time">時間帯</label>
    <select id="time">
      <option>朝</option>
      <option selected>昼</option>
      <option>夕方</option>
      <option>夜</option>
    </select>

    <label for="mood">今日の気分</label>
    <select id="mood">
      <option>元気</option>
      <option>まったり</option>
      <option>甘えたい</option>
      <option>大人っぽい</option>
    </select>

    <label for="weather">天気</label>
    <select id="weather">
      <option value="">なし</option>
      <option>晴れ</option>
      <option>雨</option>
      <option>曇り</option>
      <option>雪</option>
    </select>

    <label for="appeal">アピール</label>
    <select id="appeal">
      <option>出勤中</option>
      <option>予約受付中</option>
      <option>残りわずか</option>
    </select>

    <button class="generate" id="gen">文章を作る♪</button>
  </div>

  <div class="card result" id="results">
    <div id="list"></div>
  </div>

  <p class="foot">パターンは随時追加されます♪</p>
</div>

<script src="patterns.js"></script>
<script>
  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
  function fill(text, name) { return text.split("{name}").join(name); }

  document.getElementById("gen").addEventListener("click", function () {
    var name = document.getElementById("name").value.trim() || "わたし";
    var time = document.getElementById("time").value;
    var mood = document.getElementById("mood").value;
    var weather = document.getElementById("weather").value;
    var appeal = document.getElementById("appeal").value;

    var list = document.getElementById("list");
    list.innerHTML = "";

    for (var i = 0; i < 3; i++) {
      var lines = [];
      lines.push(fill(pick(PATTERNS.greetings[time]), name));
      if (weather) lines.push(fill(pick(PATTERNS.weather[weather]), name));
      lines.push(fill(pick(PATTERNS.moods[mood]), name));
      lines.push(fill(pick(PATTERNS.appeals[appeal]), name));
      lines.push(fill(pick(PATTERNS.closings), name));
      var text = lines.join("\n");

      var box = document.createElement("div");
      box.className = "diary";
      var p = document.createElement("p");
      p.textContent = text;
      var btn = document.createElement("button");
      btn.className = "copy";
      btn.textContent = "コピーする";
      (function (t, b) {
        b.addEventListener("click", function () {
          navigator.clipboard.writeText(t).then(function () {
            b.textContent = "コピーしました♪";
            b.classList.add("done");
            setTimeout(function () { b.textContent = "コピーする"; b.classList.remove("done"); }, 2000);
          });
        });
      })(text, btn);
      box.appendChild(p);
      box.appendChild(btn);
      list.appendChild(box);
    }
    document.getElementById("results").style.display = "block";
    document.getElementById("results").scrollIntoView({ behavior: "smooth" });
  });
</script>
</body>
</html>
